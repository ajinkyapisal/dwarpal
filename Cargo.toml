[package]
name = "dwarpal"
version = "0.1.0"
edition = "2024"
description = "Security checks for apps built with AI coding tools"
license = "MIT"
repository = "https://github.com/ajinkyapisal/dwarpal"
keywords = ["security", "firebase", "firestore", "linter", "sarif"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
